<div id="lightboxOverlay" style="position:fixed;inset:0;z-index:9999;background:rgba(8,12,24,.88);display:none;align-items:center;justify-content:center;padding:24px;">
  <button id="lightboxClose" aria-label="Zamknij" style="position:absolute;top:18px;right:18px;width:44px;height:44px;border:0;border-radius:999px;background:#fff;color:#111;font-size:26px;cursor:pointer;line-height:44px;">×</button>
  <img id="lightboxImage" alt="" style="max-width:min(95vw,1400px);max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.35);">
</div>
